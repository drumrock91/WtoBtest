<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="白髮轉烏髮療程照片紀錄、數據追蹤與報表工具"
    />
    <title>烏髮療程追蹤台</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d2b22'/%3E%3Cpath d='M17 43c3-17 10-25 22-25 5 0 8 2 8 6 0 10-14 11-14 22' fill='none' stroke='%23f6d67a' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='42' cy='42' r='6' fill='%236fbe8a1'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #17211b;
        --muted: #657267;
        --line: #d9e3dc;
        --panel: #ffffff;
        --soft: #f4f7f2;
        --soft-2: #edf3f7;
        --brand: #245b3b;
        --brand-2: #6f8f55;
        --accent: #d59c2b;
        --danger: #b84a3d;
        --shadow: 0 18px 48px rgba(23, 33, 27, 0.12);
        font-family:
          Inter, "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(111, 143, 85, 0.2), transparent 34rem),
          linear-gradient(135deg, #f8faf7 0%, #eef4f7 52%, #fbf8ee 100%);
        color: var(--ink);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 288px 1fr;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 24px 18px;
        background: rgba(255, 255, 255, 0.76);
        border-right: 1px solid rgba(217, 227, 220, 0.9);
        backdrop-filter: blur(18px);
        overflow: auto;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: var(--brand);
        display: grid;
        place-items: center;
        box-shadow: 0 10px 28px rgba(36, 91, 59, 0.22);
      }

      .brand-mark svg {
        width: 28px;
        height: 28px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 1.12rem;
        line-height: 1.25;
      }

      .subtle {
        color: var(--muted);
        font-size: 0.88rem;
      }

      .search {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 11px 12px;
        background: #fff;
        color: var(--ink);
        outline: none;
      }

      .client-list {
        margin: 14px 0 18px;
        display: grid;
        gap: 8px;
      }

      .client-tab {
        width: 100%;
        text-align: left;
        padding: 12px;
        border-radius: 8px;
        background: transparent;
        color: var(--ink);
        display: grid;
        gap: 6px;
      }

      .client-tab.active {
        background: #e7efe8;
        box-shadow: inset 0 0 0 1px rgba(36, 91, 59, 0.16);
      }

      .client-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 42px;
        padding: 4px 8px;
        border-radius: 999px;
        background: #fff;
        color: var(--brand);
        font-size: 0.76rem;
        font-weight: 700;
      }

      .primary-btn,
      .ghost-btn,
      .danger-btn {
        min-height: 42px;
        border-radius: 8px;
        padding: 0 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 750;
      }

      .primary-btn {
        background: var(--brand);
        color: #fff;
      }

      .ghost-btn {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      .danger-btn {
        background: #fff4f1;
        color: var(--danger);
        border: 1px solid #f0cbc4;
      }

      .main {
        padding: 24px;
        display: grid;
        gap: 18px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .topbar h2 {
        font-size: clamp(1.45rem, 2.4vw, 2.2rem);
        letter-spacing: 0;
      }

      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .stat {
        min-height: 100px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(217, 227, 220, 0.92);
        border-radius: 8px;
        padding: 16px;
        box-shadow: 0 12px 28px rgba(23, 33, 27, 0.07);
      }

      .stat b {
        display: block;
        font-size: 1.65rem;
        margin: 8px 0 2px;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(340px, 0.92fr) minmax(420px, 1.35fr);
        gap: 18px;
        align-items: start;
      }

      .followup-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 12px;
      }

      .followup-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #fff;
        display: grid;
        gap: 10px;
      }

      .followup-card.due {
        border-color: #e5bb62;
        background: #fffaf0;
      }

      .followup-card.overdue {
        border-color: #efb4aa;
        background: #fff5f3;
      }

      .followup-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .status-chip {
        white-space: nowrap;
        border-radius: 999px;
        padding: 5px 8px;
        font-size: 0.76rem;
        font-weight: 800;
        color: #21402d;
        background: #e9f2e8;
      }

      .status-chip.due {
        color: #7a4d00;
        background: #ffe8ac;
      }

      .status-chip.overdue {
        color: #9a2d21;
        background: #ffd8d2;
      }

      .panel {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(217, 227, 220, 0.95);
        border-radius: 8px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel-head {
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .panel-head h3 {
        font-size: 1rem;
      }

      .panel-body {
        padding: 18px;
      }

      form {
        display: grid;
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      label {
        font-size: 0.9rem;
        font-weight: 750;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 11px;
        background: #fff;
        color: var(--ink);
        outline: none;
      }

      textarea {
        min-height: 84px;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus,
      .search:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(36, 91, 59, 0.14);
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .photo-drop {
        min-height: 160px;
        border: 1px dashed #aebcac;
        border-radius: 8px;
        background: var(--soft);
        display: grid;
        place-items: center;
        text-align: center;
        padding: 18px;
        position: relative;
        overflow: hidden;
      }

      .photo-drop img {
        width: 100%;
        max-height: 260px;
        object-fit: contain;
        border-radius: 6px;
        display: none;
      }

      .photo-drop.has-photo img {
        display: block;
      }

      .photo-drop.has-photo .drop-copy {
        display: none;
      }

      .file-input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }

      .range-row {
        display: grid;
        grid-template-columns: 1fr 56px;
        gap: 10px;
        align-items: center;
      }

      input[type="range"] {
        padding: 0;
        accent-color: var(--brand);
      }

      .timeline {
        display: grid;
        gap: 12px;
      }

      .record {
        display: grid;
        grid-template-columns: 116px 1fr;
        gap: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: #fff;
      }

      .record img {
        width: 116px;
        height: 116px;
        object-fit: cover;
        border-radius: 7px;
        background: var(--soft-2);
      }

      .record-main {
        display: grid;
        gap: 9px;
      }

      .record-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .metrics {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .metric {
        padding: 6px 8px;
        border-radius: 7px;
        background: #eef4f0;
        color: #294a34;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .chart-wrap {
        height: 260px;
        padding: 16px 18px 18px;
      }

      canvas {
        width: 100%;
        height: 100%;
      }

      .report {
        display: grid;
        gap: 12px;
      }

      .report-row {
        display: grid;
        grid-template-columns: 168px 1fr;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }

      .empty {
        min-height: 210px;
        display: grid;
        place-items: center;
        text-align: center;
        color: var(--muted);
        padding: 24px;
      }

      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        background: #18251d;
        color: #fff;
        padding: 12px 14px;
        border-radius: 8px;
        box-shadow: var(--shadow);
        transform: translateY(16px);
        opacity: 0;
        pointer-events: none;
        transition: 0.2s ease;
      }

      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }

      .mobile-title {
        display: none;
      }

      @media (max-width: 1040px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .client-list {
          grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        }

        .workspace {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 720px) {
        .main {
          padding: 16px;
        }

        .topbar {
          align-items: stretch;
          flex-direction: column;
        }

        .toolbar {
          justify-content: stretch;
        }

        .toolbar button {
          flex: 1 1 140px;
        }

        .stats {
          grid-template-columns: 1fr 1fr;
        }

        .grid-2,
        .report-row {
          grid-template-columns: 1fr;
        }

        .record {
          grid-template-columns: 92px 1fr;
        }

        .record img {
          width: 92px;
          height: 92px;
        }
      }

      @media print {
        body {
          background: #fff;
        }

        .sidebar,
        .toolbar,
        .entry-panel,
        .danger-btn,
        .ghost-btn,
        .primary-btn {
          display: none !important;
        }

        .app,
        .main,
        .workspace {
          display: block;
          padding: 0;
        }

        .panel,
        .stat {
          box-shadow: none;
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none">
              <path
                d="M18 44c3-17 10-25 22-25 5 0 8 2 8 6 0 10-14 11-14 22"
                stroke="#F6D67A"
                stroke-width="7"
                stroke-linecap="round"
              />
              <circle cx="43" cy="43" r="7" fill="#6FBE8A" />
            </svg>
          </div>
          <div>
            <h1>烏髮療程追蹤台</h1>
            <p class="subtle">照片紀錄、數據追蹤、報表輸出</p>
          </div>
        </div>

        <input
          class="search"
          id="searchInput"
          type="search"
          placeholder="搜尋姓名、電話或顧問"
        />
        <div class="client-list" id="clientList"></div>
        <button class="primary-btn" id="newClientBtn" type="button">
          <span aria-hidden="true">＋</span>新增客戶
        </button>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="subtle" id="todayLabel"></p>
            <h2 id="clientTitle">新增第一位客戶</h2>
          </div>
          <div class="toolbar">
            <button class="ghost-btn" id="exportCsvBtn" type="button">匯出 CSV</button>
            <button class="ghost-btn" id="exportJsonBtn" type="button">備份 JSON</button>
            <button class="ghost-btn" id="importJsonBtn" type="button">匯入備份</button>
            <button class="primary-btn" id="printBtn" type="button">列印報表</button>
            <input id="importFile" type="file" accept="application/json" hidden />
          </div>
        </header>

        <section class="stats" aria-label="追蹤摘要">
          <div class="stat">
            <span class="subtle">追蹤天數</span>
            <b id="daysStat">0</b>
            <p class="subtle">從第一次紀錄起算</p>
          </div>
          <div class="stat">
            <span class="subtle">療程次數</span>
            <b id="sessionStat">0</b>
            <p class="subtle">含今日新增紀錄</p>
          </div>
          <div class="stat">
            <span class="subtle">黑髮比例變化</span>
            <b id="blackStat">-</b>
            <p class="subtle">末次與首次比較</p>
          </div>
          <div class="stat">
            <span class="subtle">下次建議回訪</span>
            <b id="nextStat">-</b>
            <p class="subtle">依 28 天循環推算</p>
          </div>
        </section>

        <section class="workspace">
          <section class="panel entry-panel">
            <div class="panel-head">
              <h3>客戶與本次療程</h3>
              <button class="danger-btn" id="deleteClientBtn" type="button">刪除客戶</button>
            </div>
            <div class="panel-body">
              <form id="recordForm">
                <div class="grid-2">
                  <div class="field">
                    <label for="clientName">客戶姓名</label>
                    <input id="clientName" required placeholder="例如：陳小姐" />
                  </div>
                  <div class="field">
                    <label for="clientPhone">電話</label>
                    <input id="clientPhone" inputmode="tel" placeholder="選填" />
                  </div>
                </div>
                <div class="grid-2">
                  <div class="field">
                    <label for="consultant">服務顧問</label>
                    <input id="consultant" placeholder="例如：Mina" />
                  </div>
                  <div class="field">
                    <label for="plan">方案</label>
                    <select id="plan">
                      <option>28 天烏髮循環</option>
                      <option>頭皮養護加強</option>
                      <option>單次體驗追蹤</option>
                    </select>
                  </div>
                </div>

                <div class="field">
                  <label for="photoInput">本次照片</label>
                  <div class="photo-drop" id="photoDrop">
                    <input
                      class="file-input"
                      id="photoInput"
                      type="file"
                      accept="image/*"
                      capture="environment"
                    />
                    <img id="photoPreview" alt="本次療程照片預覽" />
                    <div class="drop-copy">
                      <strong>點一下拍照或選照片</strong>
                      <p class="subtle">建議固定光源、角度與分線位置，方便比較。</p>
                    </div>
                  </div>
                </div>

                <div class="grid-2">
                  <div class="field">
                    <label for="sessionDate">療程日期</label>
                    <input id="sessionDate" type="date" required />
                  </div>
                  <div class="field">
                    <label for="area">拍攝區域</label>
                    <select id="area">
                      <option>頭頂分線</option>
                      <option>前額髮際</option>
                      <option>左側鬢角</option>
                      <option>右側鬢角</option>
                      <option>後腦區</option>
                    </select>
                  </div>
                </div>

                <div class="field">
                  <label for="grayPercent">白髮比例估計</label>
                  <div class="range-row">
                    <input id="grayPercent" type="range" min="0" max="100" value="45" />
                    <strong id="grayValue">45%</strong>
                  </div>
                </div>

                <div class="grid-2">
                  <div class="field">
                    <label for="densityScore">黑髮覆蓋感</label>
                    <select id="densityScore">
                      <option value="1">1 低</option>
                      <option value="2">2 偏低</option>
                      <option value="3" selected>3 穩定</option>
                      <option value="4">4 改善</option>
                      <option value="5">5 明顯改善</option>
                    </select>
                  </div>
                  <div class="field">
                    <label for="scalpScore">頭皮舒適度</label>
                    <select id="scalpScore">
                      <option value="1">1 緊繃</option>
                      <option value="2">2 偶有不適</option>
                      <option value="3" selected>3 正常</option>
                      <option value="4">4 舒適</option>
                      <option value="5">5 很舒適</option>
                    </select>
                  </div>
                </div>

                <div class="field">
                  <label for="notes">觀察備註</label>
                  <textarea
                    id="notes"
                    placeholder="例如：分線處新生黑髮較明顯，右側鬢角仍需加強。"
                  ></textarea>
                </div>

                <button class="primary-btn" type="submit">儲存本次紀錄</button>
              </form>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h3>趨勢與照片時間軸</h3>
              <span class="pill" id="areaSummary">尚無區域</span>
            </div>
            <div class="chart-wrap">
              <canvas id="trendChart" width="900" height="320" aria-label="白髮比例趨勢圖"></canvas>
            </div>
            <div class="panel-body">
              <div class="timeline" id="timeline"></div>
            </div>
          </section>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h3>預約提醒與關懷</h3>
            <span class="subtle" id="followupSummary">依 28 天循環排序</span>
          </div>
          <div class="panel-body">
            <div class="followup-grid" id="followupList"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h3>報表摘要</h3>
            <span class="subtle">可直接列印或交給顧問追蹤</span>
          </div>
          <div class="panel-body">
            <div class="report" id="report"></div>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const STORAGE_KEY = "hair-darkening-tracker-v1";
      const $ = (id) => document.getElementById(id);
      const today = new Date().toISOString().slice(0, 10);
      let state = loadState();
      let selectedClientId = state.clients[0]?.id || null;
      let currentPhoto = "";

      const els = {
        area: $("area"),
        areaSummary: $("areaSummary"),
        blackStat: $("blackStat"),
        clientList: $("clientList"),
        clientName: $("clientName"),
        clientPhone: $("clientPhone"),
        clientTitle: $("clientTitle"),
        consultant: $("consultant"),
        daysStat: $("daysStat"),
        deleteClientBtn: $("deleteClientBtn"),
        densityScore: $("densityScore"),
        exportCsvBtn: $("exportCsvBtn"),
        exportJsonBtn: $("exportJsonBtn"),
        followupList: $("followupList"),
        followupSummary: $("followupSummary"),
        grayPercent: $("grayPercent"),
        grayValue: $("grayValue"),
        importFile: $("importFile"),
        importJsonBtn: $("importJsonBtn"),
        newClientBtn: $("newClientBtn"),
        nextStat: $("nextStat"),
        notes: $("notes"),
        photoDrop: $("photoDrop"),
        photoInput: $("photoInput"),
        photoPreview: $("photoPreview"),
        plan: $("plan"),
        printBtn: $("printBtn"),
        recordForm: $("recordForm"),
        report: $("report"),
        scalpScore: $("scalpScore"),
        searchInput: $("searchInput"),
        sessionDate: $("sessionDate"),
        sessionStat: $("sessionStat"),
        timeline: $("timeline"),
        toast: $("toast"),
        trendChart: $("trendChart"),
      };

      $("todayLabel").textContent = new Intl.DateTimeFormat("zh-TW", {
        dateStyle: "full",
      }).format(new Date());
      els.sessionDate.value = today;

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved?.clients && saved?.records) return saved;
        } catch (error) {
          console.warn(error);
        }
        return { clients: [], records: [] };
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function uid(prefix) {
        return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function selectedClient() {
        return state.clients.find((client) => client.id === selectedClientId) || null;
      }

      function selectedRecords() {
        return state.records
          .filter((record) => record.clientId === selectedClientId)
          .sort((a, b) => new Date(a.date) - new Date(b.date));
      }

      function latestRecord() {
        return selectedRecords().at(-1) || null;
      }

      function showToast(message) {
        els.toast.textContent = message;
        els.toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 2200);
      }

      function fillFormFromClient() {
        const client = selectedClient();
        els.deleteClientBtn.disabled = !client;
        if (!client) {
          els.clientTitle.textContent = "新增第一位客戶";
          els.clientName.value = "";
          els.clientPhone.value = "";
          els.consultant.value = "";
          els.plan.value = "28 天烏髮循環";
          clearSessionFields();
          return;
        }
        els.clientTitle.textContent = client.name || "未命名客戶";
        els.clientName.value = client.name || "";
        els.clientPhone.value = client.phone || "";
        els.consultant.value = client.consultant || "";
        els.plan.value = client.plan || "28 天烏髮循環";
        const latest = latestRecord();
        if (latest) {
          els.grayPercent.value = latest.grayPercent;
          els.grayValue.textContent = `${latest.grayPercent}%`;
          els.area.value = latest.area;
          els.densityScore.value = latest.densityScore;
          els.scalpScore.value = latest.scalpScore;
        }
        clearPhoto();
      }

      function clearSessionFields() {
        els.sessionDate.value = today;
        els.area.value = "頭頂分線";
        els.grayPercent.value = 45;
        els.grayValue.textContent = "45%";
        els.densityScore.value = 3;
        els.scalpScore.value = 3;
        els.notes.value = "";
        clearPhoto();
      }

      function clearPhoto() {
        currentPhoto = "";
        els.photoPreview.removeAttribute("src");
        els.photoDrop.classList.remove("has-photo");
        els.photoInput.value = "";
      }

      function renderClients() {
        const term = els.searchInput.value.trim().toLowerCase();
        const clients = state.clients.filter((client) =>
          [client.name, client.phone, client.consultant].some((value) =>
            (value || "").toLowerCase().includes(term),
          ),
        );
        els.clientList.innerHTML = clients.length
          ? clients
              .map((client) => {
                const count = state.records.filter((record) => record.clientId === client.id).length;
                const latest = state.records
                  .filter((record) => record.clientId === client.id)
                  .sort((a, b) => new Date(b.date) - new Date(a.date))[0];
                return `<button class="client-tab ${client.id === selectedClientId ? "active" : ""}" data-client-id="${client.id}" type="button">
                  <span class="client-row"><strong>${escapeHtml(client.name || "未命名客戶")}</strong><span class="pill">${count} 次</span></span>
                  <span class="subtle">${escapeHtml(client.consultant || "未指定顧問")} · ${latest ? formatDate(latest.date) : "尚無紀錄"}</span>
                </button>`;
              })
              .join("")
          : `<div class="empty">還沒有符合的客戶。</div>`;
      }

      function renderStats() {
        const records = selectedRecords();
        const first = records[0];
        const last = records.at(-1);
        els.sessionStat.textContent = records.length;
        if (!records.length) {
          els.daysStat.textContent = "0";
          els.blackStat.textContent = "-";
          els.nextStat.textContent = "-";
          els.areaSummary.textContent = "尚無區域";
          return;
        }
        const days = Math.max(1, diffDays(first.date, last.date) + 1);
        const firstBlack = 100 - Number(first.grayPercent);
        const lastBlack = 100 - Number(last.grayPercent);
        const delta = lastBlack - firstBlack;
        const next = addDays(last.date, 28);
        const areas = [...new Set(records.map((record) => record.area))].join("、");
        els.daysStat.textContent = days;
        els.blackStat.textContent = `${delta >= 0 ? "+" : ""}${delta}%`;
        els.nextStat.textContent = formatDate(next);
        els.areaSummary.textContent = areas || "尚無區域";
      }

      function renderTimeline() {
        const records = selectedRecords().slice().reverse();
        if (!records.length) {
          els.timeline.innerHTML = `<div class="empty">儲存第一次療程後，這裡會出現照片時間軸與每次數據。</div>`;
          return;
        }
        els.timeline.innerHTML = records
          .map((record) => {
            const photo = record.photo || placeholderImage();
            return `<article class="record">
              <img src="${photo}" alt="${escapeHtml(record.area)} ${formatDate(record.date)} 照片" />
              <div class="record-main">
                <div class="record-title">
                  <strong>${formatDate(record.date)} · ${escapeHtml(record.area)}</strong>
                  <button class="danger-btn" data-delete-record="${record.id}" type="button">刪除</button>
                </div>
                <div class="metrics">
                  <span class="metric">白髮 ${record.grayPercent}%</span>
                  <span class="metric">黑髮 ${100 - record.grayPercent}%</span>
                  <span class="metric">覆蓋 ${record.densityScore}/5</span>
                  <span class="metric">舒適 ${record.scalpScore}/5</span>
                </div>
                <p class="subtle">${escapeHtml(record.notes || "未填寫觀察備註")}</p>
              </div>
            </article>`;
          })
          .join("");
      }

      function renderReport() {
        const client = selectedClient();
        const records = selectedRecords();
        if (!client) {
          els.report.innerHTML = `<div class="empty">新增客戶並儲存療程後，系統會自動產生報表摘要。</div>`;
          return;
        }
        const first = records[0];
        const last = records.at(-1);
        const avgGray = records.length
          ? Math.round(records.reduce((sum, record) => sum + Number(record.grayPercent), 0) / records.length)
          : "-";
        const improvement =
          first && last ? `${Number(first.grayPercent) - Number(last.grayPercent)}%` : "-";
        els.report.innerHTML = [
          ["客戶", `${client.name || "未命名"}（${client.phone || "未填電話"}）`],
          ["服務顧問", client.consultant || "未指定"],
          ["方案", client.plan || "未指定"],
          ["紀錄期間", first && last ? `${formatDate(first.date)} 到 ${formatDate(last.date)}` : "尚無療程紀錄"],
          ["平均白髮比例", avgGray === "-" ? "-" : `${avgGray}%`],
          ["白髮比例下降", improvement],
          ["最近觀察", last?.notes || "尚無觀察備註"],
          ["建議", records.length >= 2 ? recommendation(first, last) : "先完成至少兩次紀錄後，再判讀趨勢。"],
        ]
          .map(
            ([label, value]) => `<div class="report-row"><strong>${label}</strong><span>${escapeHtml(value)}</span></div>`,
          )
          .join("");
      }

      function renderFollowups() {
        const items = state.clients
          .map((client) => {
            const records = state.records
              .filter((record) => record.clientId === client.id)
              .sort((a, b) => new Date(a.date) - new Date(b.date));
            const latest = records.at(-1);
            if (!latest) {
              return {
                client,
                records,
                latest: null,
                nextDate: null,
                daysUntil: null,
                status: "new",
                statusText: "待建立",
                sort: -999,
              };
            }
            const nextDate = addDays(latest.date, 28);
            const daysUntil = diffDays(today, nextDate);
            const status = daysUntil < 0 ? "overdue" : daysUntil <= 7 ? "due" : "ok";
            const statusText =
              status === "overdue"
                ? `逾期 ${Math.abs(daysUntil)} 天`
                : status === "due"
                  ? `${daysUntil} 天內`
                  : `${daysUntil} 天後`;
            return {
              client,
              records,
              latest,
              nextDate,
              daysUntil,
              status,
              statusText,
              sort: daysUntil,
            };
          })
          .sort((a, b) => a.sort - b.sort);

        const actionable = items.filter((item) => item.status === "overdue" || item.status === "due").length;
        els.followupSummary.textContent = actionable ? `${actionable} 位需要安排或關懷` : "目前沒有急迫提醒";

        if (!items.length) {
          els.followupList.innerHTML = `<div class="empty">新增客戶與療程紀錄後，這裡會自動列出預約提醒。</div>`;
          return;
        }

        els.followupList.innerHTML = items
          .map((item) => {
            const latestGray = item.latest ? `${item.latest.grayPercent}%` : "尚無";
            const message = buildCareMessage(item);
            const cardState = item.status === "overdue" ? "overdue" : item.status === "due" ? "due" : "";
            return `<article class="followup-card ${cardState}">
              <div class="followup-top">
                <div>
                  <strong>${escapeHtml(item.client.name || "未命名客戶")}</strong>
                  <p class="subtle">${escapeHtml(item.client.phone || "未填電話")} · ${escapeHtml(item.client.consultant || "未指定顧問")}</p>
                </div>
                <span class="status-chip ${cardState}">${escapeHtml(item.statusText)}</span>
              </div>
              <div class="metrics">
                <span class="metric">下次 ${item.nextDate ? formatDate(item.nextDate) : "待安排"}</span>
                <span class="metric">紀錄 ${item.records.length} 次</span>
                <span class="metric">白髮 ${latestGray}</span>
              </div>
              <p class="subtle">${escapeHtml(careAdvice(item))}</p>
              <button class="ghost-btn" data-care-message="${escapeHtml(message)}" type="button">複製關懷訊息</button>
            </article>`;
          })
          .join("");
      }

      function careAdvice(item) {
        if (!item.latest) return "先安排第一次拍照建檔，建立後續比較基準。";
        if (item.status === "overdue") return "優先聯繫回訪，確認居家養護狀況並安排補拍同角度照片。";
        if (item.status === "due") return "提醒客戶預約下次循環，關心頭皮舒適度與白髮區域變化。";
        return "持續追蹤即可，下次關懷可帶入最近一次照片與黑髮比例變化。";
      }

      function buildCareMessage(item) {
        const name = item.client.name || "您好";
        if (!item.latest) {
          return `${name}您好，想和您安排第一次烏髮療程拍照建檔，之後比較白髮與黑髮變化會更清楚。方便幫您預約時間嗎？`;
        }
        const next = formatDate(item.nextDate);
        const gray = item.latest.grayPercent;
        return `${name}您好，上次烏髮療程後目前白髮比例紀錄約 ${gray}%。依 28 天循環，建議下次回訪安排在 ${next} 前後，也想關心您最近頭皮舒適度與居家養護狀況。方便幫您預約下一次時間嗎？`;
      }

      function recommendation(first, last) {
        const grayDrop = Number(first.grayPercent) - Number(last.grayPercent);
        if (grayDrop >= 10) return "維持 28 天循環，固定拍攝同一區域以累積對比證據。";
        if (grayDrop >= 1) return "已有改善跡象，建議補強白髮比例較高的拍攝區域。";
        return "目前改善不明顯，建議檢查作息、居家養護與拍照光源是否一致。";
      }

      function drawChart() {
        const canvas = els.trendChart;
        const ctx = canvas.getContext("2d");
        const records = selectedRecords();
        const width = canvas.width;
        const height = canvas.height;
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        const pad = { top: 26, right: 32, bottom: 48, left: 58 };
        const plotW = width - pad.left - pad.right;
        const plotH = height - pad.top - pad.bottom;
        ctx.strokeStyle = "#d9e3dc";
        ctx.lineWidth = 1;
        ctx.font = "24px Microsoft JhengHei, sans-serif";
        ctx.fillStyle = "#657267";
        for (let i = 0; i <= 4; i++) {
          const y = pad.top + (plotH * i) / 4;
          ctx.beginPath();
          ctx.moveTo(pad.left, y);
          ctx.lineTo(width - pad.right, y);
          ctx.stroke();
          ctx.fillText(`${100 - i * 25}%`, 8, y + 8);
        }
        if (records.length < 2) {
          ctx.fillStyle = "#657267";
          ctx.font = "30px Microsoft JhengHei, sans-serif";
          ctx.fillText("至少兩次紀錄後顯示趨勢", pad.left + 20, height / 2);
          return;
        }
        const xFor = (index) => pad.left + (plotW * index) / (records.length - 1);
        const yFor = (grayPercent) => pad.top + (plotH * Number(grayPercent)) / 100;
        ctx.strokeStyle = "#245b3b";
        ctx.lineWidth = 5;
        ctx.beginPath();
        records.forEach((record, index) => {
          const x = xFor(index);
          const y = yFor(record.grayPercent);
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
        records.forEach((record, index) => {
          const x = xFor(index);
          const y = yFor(record.grayPercent);
          ctx.fillStyle = "#d59c2b";
          ctx.beginPath();
          ctx.arc(x, y, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#17211b";
          ctx.font = "22px Microsoft JhengHei, sans-serif";
          ctx.fillText(formatShortDate(record.date), x - 38, height - 12);
        });
        ctx.fillStyle = "#17211b";
        ctx.font = "24px Microsoft JhengHei, sans-serif";
        ctx.fillText("白髮比例", pad.left, 22);
      }

      function renderAll() {
        if (!selectedClientId && state.clients[0]) selectedClientId = state.clients[0].id;
        fillFormFromClient();
        renderClients();
        renderStats();
        renderTimeline();
        renderFollowups();
        renderReport();
        drawChart();
      }

      els.grayPercent.addEventListener("input", () => {
        els.grayValue.textContent = `${els.grayPercent.value}%`;
      });

      els.photoInput.addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        currentPhoto = await imageToDataUrl(file);
        els.photoPreview.src = currentPhoto;
        els.photoDrop.classList.add("has-photo");
      });

      els.recordForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = els.clientName.value.trim();
        if (!name) {
          showToast("請先輸入客戶姓名");
          return;
        }
        let client = selectedClient();
        if (!client) {
          client = { id: uid("client") };
          state.clients.push(client);
          selectedClientId = client.id;
        }
        client.name = name;
        client.phone = els.clientPhone.value.trim();
        client.consultant = els.consultant.value.trim();
        client.plan = els.plan.value;
        client.updatedAt = new Date().toISOString();

        state.records.push({
          id: uid("record"),
          clientId: client.id,
          date: els.sessionDate.value,
          area: els.area.value,
          grayPercent: Number(els.grayPercent.value),
          densityScore: Number(els.densityScore.value),
          scalpScore: Number(els.scalpScore.value),
          notes: els.notes.value.trim(),
          photo: currentPhoto,
          createdAt: new Date().toISOString(),
        });
        saveState();
        clearSessionFields();
        renderAll();
        showToast("已儲存療程紀錄");
      });

      els.clientList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-client-id]");
        if (!button) return;
        selectedClientId = button.dataset.clientId;
        renderAll();
      });

      els.timeline.addEventListener("click", (event) => {
        const button = event.target.closest("[data-delete-record]");
        if (!button) return;
        state.records = state.records.filter((record) => record.id !== button.dataset.deleteRecord);
        saveState();
        renderAll();
        showToast("已刪除該筆紀錄");
      });

      els.followupList.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-care-message]");
        if (!button) return;
        const message = button.dataset.careMessage;
        try {
          await navigator.clipboard.writeText(message);
          showToast("已複製關懷訊息");
        } catch (error) {
          window.prompt("複製以下關懷訊息", message);
        }
      });

      els.newClientBtn.addEventListener("click", () => {
        selectedClientId = null;
        clearSessionFields();
        renderAll();
        els.clientName.focus();
      });

      els.deleteClientBtn.addEventListener("click", () => {
        const client = selectedClient();
        if (!client) return;
        if (!window.confirm(`確定刪除 ${client.name || "這位客戶"} 與所有照片紀錄？`)) return;
        state.clients = state.clients.filter((item) => item.id !== client.id);
        state.records = state.records.filter((record) => record.clientId !== client.id);
        selectedClientId = state.clients[0]?.id || null;
        saveState();
        renderAll();
        showToast("已刪除客戶");
      });

      els.searchInput.addEventListener("input", renderClients);
      els.printBtn.addEventListener("click", () => window.print());
      els.exportCsvBtn.addEventListener("click", exportCsv);
      els.exportJsonBtn.addEventListener("click", exportJson);
      els.importJsonBtn.addEventListener("click", () => els.importFile.click());
      els.importFile.addEventListener("change", importJson);

      function exportCsv() {
        const rows = [["客戶", "電話", "顧問", "方案", "日期", "區域", "白髮比例", "黑髮比例", "覆蓋感", "舒適度", "備註"]];
        state.records.forEach((record) => {
          const client = state.clients.find((item) => item.id === record.clientId) || {};
          rows.push([
            client.name || "",
            client.phone || "",
            client.consultant || "",
            client.plan || "",
            record.date,
            record.area,
            record.grayPercent,
            100 - record.grayPercent,
            record.densityScore,
            record.scalpScore,
            record.notes || "",
          ]);
        });
        download(`烏髮療程紀錄-${today}.csv`, rows.map(toCsvRow).join("\n"), "text/csv;charset=utf-8");
      }

      function exportJson() {
        download(`烏髮療程備份-${today}.json`, JSON.stringify(state, null, 2), "application/json");
      }

      async function importJson(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        try {
          const imported = JSON.parse(await file.text());
          if (!Array.isArray(imported.clients) || !Array.isArray(imported.records)) {
            throw new Error("Invalid backup");
          }
          state = imported;
          selectedClientId = state.clients[0]?.id || null;
          saveState();
          renderAll();
          showToast("已匯入備份");
        } catch (error) {
          showToast("備份檔格式不正確");
        } finally {
          event.target.value = "";
        }
      }

      function imageToDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result));
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function download(filename, content, type) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function toCsvRow(row) {
        return row.map((value) => `"${String(value).replaceAll('"', '""')}"`).join(",");
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatDate(value) {
        if (!value) return "-";
        return new Intl.DateTimeFormat("zh-TW", {
          month: "2-digit",
          day: "2-digit",
        }).format(new Date(value));
      }

      function formatShortDate(value) {
        const date = new Date(value);
        return `${date.getMonth() + 1}/${date.getDate()}`;
      }

      function diffDays(start, end) {
        return Math.round((new Date(end) - new Date(start)) / 86400000);
      }

      function addDays(value, days) {
        const date = new Date(value);
        date.setDate(date.getDate() + days);
        return date.toISOString().slice(0, 10);
      }

      function placeholderImage() {
        return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 240'%3E%3Crect width='240' height='240' fill='%23edf3f7'/%3E%3Cpath d='M72 152c12-52 41-76 87-70 20 3 31 13 30 28-2 31-48 33-49 73' fill='none' stroke='%23657267' stroke-width='13' stroke-linecap='round' opacity='.55'/%3E%3Ccircle cx='150' cy='157' r='18' fill='%23d59c2b' opacity='.75'/%3E%3C/svg%3E";
      }

      function registerWebMcpTools() {
        const context = document.modelContext;
        if (!context?.registerTool) return;
        const controller = new AbortController();
        const readSchema = { type: "object", properties: {}, additionalProperties: false };
        const addSchema = {
          type: "object",
          properties: {
            clientName: { type: "string" },
            phone: { type: "string" },
            consultant: { type: "string" },
            date: { type: "string" },
            area: { type: "string" },
            grayPercent: { type: "number", minimum: 0, maximum: 100 },
            densityScore: { type: "number", minimum: 1, maximum: 5 },
            scalpScore: { type: "number", minimum: 1, maximum: 5 },
            notes: { type: "string" },
          },
          required: ["clientName", "date", "area", "grayPercent"],
          additionalProperties: false,
        };
        context.registerTool(
          {
            name: "read_hair_treatment_summary",
            title: "Read hair treatment summary",
            description: "Return the currently selected client's treatment count and trend summary.",
            inputSchema: readSchema,
            annotations: { readOnlyHint: true, untrustedContentHint: true },
            execute() {
              const client = selectedClient();
              const records = selectedRecords();
              return {
                client: client?.name || null,
                records: records.length,
                firstGrayPercent: records[0]?.grayPercent ?? null,
                latestGrayPercent: records.at(-1)?.grayPercent ?? null,
              };
            },
          },
          { signal: controller.signal },
        );
        context.registerTool(
          {
            name: "create_hair_treatment_record",
            title: "Create hair treatment record",
            description: "Create a client if needed and add one non-photo hair treatment record.",
            inputSchema: addSchema,
            annotations: { readOnlyHint: false, untrustedContentHint: true },
            execute(input) {
              if (!input || typeof input !== "object") throw new Error("Invalid input");
              const data = input;
              let client = state.clients.find((item) => item.name === data.clientName);
              if (!client) {
                client = { id: uid("client"), name: data.clientName };
                state.clients.push(client);
              }
              Object.assign(client, {
                phone: data.phone || client.phone || "",
                consultant: data.consultant || client.consultant || "",
                plan: client.plan || "28 天烏髮循環",
                updatedAt: new Date().toISOString(),
              });
              state.records.push({
                id: uid("record"),
                clientId: client.id,
                date: data.date,
                area: data.area,
                grayPercent: Number(data.grayPercent),
                densityScore: Number(data.densityScore || 3),
                scalpScore: Number(data.scalpScore || 3),
                notes: data.notes || "",
                photo: "",
                createdAt: new Date().toISOString(),
              });
              selectedClientId = client.id;
              saveState();
              renderAll();
              return { clientId: client.id, recordCount: selectedRecords().length };
            },
          },
          { signal: controller.signal },
        );
      }

      renderAll();
      registerWebMcpTools();
    </script>
  </body>
</html>
